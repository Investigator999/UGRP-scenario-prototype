<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRP Scenario Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a government back-office workspace. Scenario steps on one side, the working screen in the middle,
   and "what the implementer must build" beside it, so every screen is also a requirement. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --sunk:#F7F8FA; --ink:#15171C; --muted:#555C6B; --line:#DCE0E6;
  --accent:#7A1E3A; --accent-ink:#FFFFFF; --accent-soft:#F5E8ED;
  --oracle:#1D4C77; --oracle-soft:#E7EFF7;
  --ok:#1C6E46; --ok-soft:#E3F2EA; --warn:#8A5300; --warn-soft:#FCF0DA; --bad:#A8231C; --bad-soft:#FBE8E6;
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121317; --surface:#1B1D23; --sunk:#16181D; --ink:#ECEDEF; --muted:#A3A9B6; --line:#2E323B;
    --accent:#D4708F; --accent-ink:#1A0C11; --accent-soft:#35202A;
    --oracle:#8CB8E2; --oracle-soft:#1B2836;
    --ok:#6CCB97; --ok-soft:#173025; --warn:#E6B15C; --warn-soft:#33270F; --bad:#F08A80; --bad-soft:#3A1B19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121317; --surface:#1B1D23; --sunk:#16181D; --ink:#ECEDEF; --muted:#A3A9B6; --line:#2E323B;
  --accent:#D4708F; --accent-ink:#1A0C11; --accent-soft:#35202A;
  --oracle:#8CB8E2; --oracle-soft:#1B2836;
  --ok:#6CCB97; --ok-soft:#173025; --warn:#E6B15C; --warn-soft:#33270F; --bad:#F08A80; --bad-soft:#3A1B19;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
html[lang="ar"] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,sans-serif;font-size:15.5px}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.num,th.num{font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
.mono{font-family:var(--mono);font-size:.9em}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1500px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.brand h1{font-size:16px;font-weight:600}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tools{display:flex;gap:8px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;min-height:40px;display:inline-flex;align-items:center;gap:8px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent;border-style:dashed}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:32px;padding:5px 10px;font-size:13px}

/* layout */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:20px;max-width:1500px;margin:0 auto;padding:20px}
@media (max-width:1180px){.layout{grid-template-columns:230px minmax(0,1fr)}.side{grid-column:1/-1}}
@media (max-width:780px){.layout{grid-template-columns:1fr;padding:14px}}

/* stepper */
.steps{display:flex;flex-direction:column;gap:14px;align-self:start;position:sticky;top:76px}
.cycle{display:flex;flex-direction:column;gap:4px}
.cycle-name{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-inline:8px}
html[lang="ar"] .cycle-name{letter-spacing:0;font-size:12.5px}
.stepbtn{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;text-align:start;border:1px solid transparent;background:transparent;border-radius:9px;padding:8px;cursor:pointer;width:100%}
.stepbtn:hover{background:var(--surface)}
.stepbtn[aria-current="step"]{background:var(--surface);border-color:var(--line);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.stepbtn .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--muted)}
.stepbtn.done .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.stepbtn[aria-current="step"] .n{border-color:var(--accent);color:var(--accent)}
.stepbtn.done[aria-current="step"] .n{color:var(--surface);background:var(--ok);border-color:var(--ok)}
.stepbtn .t{font-size:14px;font-weight:500;line-height:1.3}
.stepbtn .r{display:block;font-size:12px;color:var(--muted);font-weight:400}
.stepbtn.locked{color:var(--muted)}
.stepbtn .so{color:var(--ok)}
@media (max-width:780px){
  .steps{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:4px}
  .cycle{flex-direction:row}
  .cycle-name{display:none}
  .stepbtn{width:auto;min-width:190px}
}

/* screen */
.screen{display:flex;flex-direction:column;gap:16px;min-width:0}
.screen-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:13px}
.screen-head h2{font-size:24px;font-weight:600;margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{font-size:17px;font-weight:600}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.lead{color:var(--muted);margin:0;max-width:70ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0}
.facts div{background:var(--sunk);border-radius:8px;padding:9px 11px}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav-foot{display:flex;justify-content:space-between;gap:8px}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{font-size:12px;font-weight:600;color:var(--muted);text-align:start;padding:9px 12px;background:var(--sunk);border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tr:last-child td{border-bottom:0}
table.data tr.sub td{background:var(--sunk);font-weight:600}
table.data tr.total td{font-weight:700;border-top:2px solid var(--line)}
table.data .code,.mono{unicode-bidi:isolate;direction:ltr}
table.data .code{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
input.amt{width:130px;text-align:end;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-variant-numeric:tabular-nums}
input.qty{width:80px;text-align:end;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-variant-numeric:tabular-nums}
input:disabled{background:transparent;border-color:transparent;color:var(--ink)}
input.amt:not(:disabled),input.qty:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.radio{display:flex;align-items:center;gap:10px;cursor:pointer}
.radio input{width:18px;height:18px;accent-color:var(--accent)}

/* status */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.info{background:var(--oracle-soft);color:var(--oracle)}
.banner{border-radius:10px;padding:12px 14px;font-size:14px;border:1px solid}
.banner.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.banner.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.info{background:var(--oracle-soft);color:var(--oracle);border-color:color-mix(in srgb,var(--oracle) 30%,transparent)}
.banner b{font-weight:700}
.locked-card{align-items:flex-start}

/* funds panel */
.funds{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.funds div{border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.funds dt{font-size:12px;color:var(--muted)}
.funds dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
.funds .hl{border-color:var(--accent);background:var(--accent-soft)}

/* signatories */
.signers{display:flex;flex-direction:column;gap:8px}
.signer{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.codebox{font-family:var(--mono);font-size:12.5px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;white-space:pre;direction:ltr;text-align:left;margin:0}

/* side */
.side{display:flex;flex-direction:column;gap:16px;align-self:start;position:sticky;top:76px}
@media (max-width:1180px){.side{position:static;display:grid;grid-template-columns:1fr 1fr}}
@media (max-width:780px){.side{grid-template-columns:1fr}}
.oracle{border-color:color-mix(in srgb,var(--oracle) 35%,var(--line))}
.oracle .eyebrow{color:var(--oracle)}
.map{display:flex;flex-direction:column;gap:10px;margin:0}
.map dt{font-size:12px;font-weight:600;color:var(--oracle)}
.map dd{margin:2px 0 0;font-size:13.5px}
.ac{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);resize:vertical}
label.lbl{font-size:13px;font-weight:500}

/* monitor */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .s{font-size:12.5px;color:var(--muted)}
.use{display:flex;align-items:center;gap:8px;min-width:150px}
.usebar{flex:1;height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;display:flex}
.usebar span{display:block;height:100%}
.u-act{background:var(--accent)}
.u-com{background:color-mix(in srgb,var(--accent) 45%,var(--surface))}
.u-res{background:color-mix(in srgb,var(--warn) 55%,var(--surface))}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.chart{direction:ltr;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:560px;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .fc{fill:var(--oracle-soft);stroke:var(--oracle);stroke-width:1}
.chart .ac{fill:var(--accent)}
.chart .today{stroke:var(--ink);stroke-dasharray:3 3;stroke-width:1}
.chart .lbl{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--font)}
.audit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.audit li{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.audit li:last-child{border-bottom:0}
.audit time{color:var(--muted);font-variant-numeric:tabular-nums}
.audit .who{color:var(--muted);font-size:12.5px;display:block}

/* spec & approach */
.page{max-width:1100px;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.page h2{font-size:26px;font-weight:600}
.spec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.spec-step{gap:10px}
.method{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;counter-reset:m}
.method li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;counter-increment:m}
.method li::before{content:counter(m);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;margin-bottom:10px}
.method h3{font-size:16px;margin-bottom:4px}
.method p{margin:0;color:var(--muted);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:780px){.two{grid-template-columns:1fr}}
.card ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--accent)}
.hero h2{font-size:34px}
.hero .role{margin:0;color:var(--muted);font-weight:500}
.hero .pitch{margin:0;max-width:72ch;font-size:16.5px}
.hero .contact{margin:0;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.about .col{display:flex;flex-direction:column;gap:14px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.timeline li:last-child{border-bottom:0}
.timeline .yr{color:var(--accent);font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.timeline .org{display:block;color:var(--muted);font-size:13.5px}
.timeline p{margin:4px 0 0;font-size:14px}
.build{justify-content:space-between}
.build .btn{align-self:flex-start}
h3.sec{font-size:19px}
.feat{border-top:3px solid var(--accent)}
.feat ul{font-size:14px}
.feat .why{margin:0;font-weight:600;font-size:14px;color:var(--accent)}
a.btn{text-decoration:none;color:inherit}

.gap{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.gap .why{margin:0;font-weight:600;color:var(--accent);max-width:80ch}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;grid-template-rows:repeat(4,auto);gap:8px;align-items:stretch}
.flow .src{grid-column:1;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.flow .arrow{grid-row:1/5;align-self:center;color:var(--muted);font-size:22px}
html[dir="rtl"] .flow .arrow{transform:scaleX(-1)}
.flow .a1{grid-column:2}.flow .a2{grid-column:4}
.flow .model{grid-column:3;grid-row:1/5;align-self:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:14px}
.flow .out{grid-column:5;grid-row:1/5;align-self:center;background:var(--oracle-soft);border:1px solid var(--oracle);border-radius:10px;padding:14px}
.flow b{display:block;font-size:14px}
.flow span{display:block;font-size:13px;color:var(--muted)}
@media (max-width:780px){.flow{grid-template-columns:1fr;grid-template-rows:none}.flow>*{grid-column:1!important;grid-row:auto!important}.flow .arrow{transform:rotate(90deg);justify-self:center}html[dir="rtl"] .flow .arrow{transform:rotate(90deg)}}
.shots{display:grid;grid-template-columns:1fr;gap:14px}
.shots figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.shots img{display:block;width:100%;height:auto}
.shots figcaption{padding:8px 12px;font-size:12.5px;color:var(--muted)}
.princ{margin:0;padding-inline-start:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 18px;font-size:14px}
.proof{border-top:4px solid var(--ok)}
.proof .eyebrow{color:var(--ok)}
.proof .why{margin:0;font-weight:600;color:var(--accent);max-width:80ch}
.steps4{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;counter-reset:s}
.steps4 li{counter-increment:s;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:3px}
.steps4 li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700;margin-bottom:4px}
.steps4 b{font-size:14px}.steps4 span{font-size:13px;color:var(--muted)}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gallery .wide{grid-column:1/-1}
@media (max-width:780px){.gallery{grid-template-columns:1fr}}
.gallery figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.gallery img{display:block;width:100%;height:auto}
.gallery figcaption{padding:8px 12px;font-size:12.5px;color:var(--muted)}
footer{max-width:1500px;margin:0 auto;padding:6px 20px 28px;color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.btn,.stepbtn,.tab{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- reference data (illustrative) ---------- */
const STEPS = [
  {id:'circular', cyc:'plan',    role:'mof',    en:'Budget circular & ceilings',        ar:'تعميم الموازنة والسقوف'},
  {id:'proposal', cyc:'plan',    role:'entfin', en:'Entity budget proposal',            ar:'مقترح موازنة الجهة'},
  {id:'approve',  cyc:'plan',    role:'mof',    en:'Review, approve & allocate',        ar:'المراجعة والاعتماد والتوزيع'},
  {id:'pr',       cyc:'procure', role:'req',    en:'Purchase requisition & funds check',ar:'طلب الشراء وفحص توفر الاعتماد'},
  {id:'po',       cyc:'procure', role:'proc',   en:'Quotations & purchase order',       ar:'عروض الأسعار وأمر الشراء'},
  {id:'grn',      cyc:'procure', role:'wh',     en:'Receipt of goods',                  ar:'استلام البضاعة'},
  {id:'inv',      cyc:'pay',     role:'ap',     en:'Invoice & 3-way match',             ar:'الفاتورة والمطابقة الثلاثية'},
  {id:'pay',      cyc:'pay',     role:'tr',     en:'Payment & bank file',               ar:'الدفع وملف البنك'},
  {id:'monitor',  cyc:'monitor', role:'mgmt',   en:'Budget & cash position',            ar:'موقف الموازنة والسيولة'}
];
const CYCLES = {

const quote = id => QUOTES.find(q=>q.id===id);
const quoteTotal = q => S.pr.items.reduce((a,i)=>a+i.qty*q.p[i.id],0);
const invTotal = () => S.po ? S.pr.items.reduce((a,i)=>a+(S.inv.qty[i.id]||0)*S.po.prices[i.id],0) : 0;
const band = amt => BANDS.find(b => amt <= b.max);
function audit(role, en, ar, date){ S.audit.unshift({role, en, ar, date}); }

function ledger(){
  return S.lines.map(l=>{
    if(!S.approved) return {...l, ap:0,res:0,com:0,act:0,paid:0,avail:0};
    let res=0, com=l.seed.com, act=l.seed.act, paid=l.seed.act;
    if(l.code===PR_LINE){
      if(S.pr.status==='reserved' && !S.po) res = prTotal();
      if(S.po){
        const inv = S.inv.status==='approved' ? invTotal() : 0;
        com += S.po.amount - inv; act += inv; if(S.pay.released) paid += inv;
      }
    }
    return {...l, ap:l.appr, res, com, act, paid, avail:l.appr-res-com-act};
  });
}
function chTotals(field){
  const t={2:0,3:0}; S.lines.forEach(l=>t[l.ch]+=l[field]); return t;
}
function isDone(id){
  return {circular:S.circular, proposal:S.submitted, approve:S.approved, pr:S.pr.status==='reserved'||!!S.po,
    po:!!S.po, grn:S.grn.done, inv:S.inv.status==='approved', pay:S.pay.released, monitor:S.pay.released}[id];
}
function unlocked(i){
  if(STEPS[i].id==='monitor') return S.approved;
  return i===0 || isDone(STEPS[i-1].id);
}

/* ---------- scenario view ---------- */
function scenarioView(){
  const st = STEPS[S.step];
  return `<div class="layout">${stepper()}<main class="screen" id="main">${screenHead(st)}${unlocked(S.step)?screenBody(st.id):lockedCard()}${navFoot()}</main>${side(st)}</div>`;
}
function stepper(){
  let html='<nav class="steps" aria-label="'+L('Scenario steps','خطوات السيناريو')+'">', cur=null;
  STEPS.forEach((s,i)=>{
    if(s.cyc!==cur){ if(cur) html+='</div>'; cur=s.cyc; html+=`<div class="cycle"><div class="cycle-name">${T(CYCLES[s.cyc])}</div>`; }
    const done=isDone(s.id), un=unlocked(i), so=S.signoff[s.id]?.status==='agree';
    html+=`<button class="stepbtn ${done?'done':''} ${un?'':'locked'}" data-act="go" data-arg="${i}" ${S.step===i?'aria-current="step"':''}>
      <span class="n">${done?ICON.check:(un?i+1:ICON.lock)}</span>
      <span class="t">${T(s)}<span class="r">${T(ROLES[s.role])}</span></span>
      ${so?`<span class="so" title="${L('Agreed by key user','وافق عليه المستخدم الرئيسي')}" aria-label="${L('Agreed by key user','وافق عليه المستخدم الرئيسي')}">${ICON.user}</span>`:'<span></span>'}
    </button>`;
  });
  return html+'</div></nav>';
}
function screenHead(st){

function lockedCard(){

function navFoot(){

}

/* 2. proposal */
function chapterRows(field, editable, bindKey, showPrev){
  let rows='';
  [2,3].forEach(ch=>{
    S.lines.filter(l=>l.ch===ch).forEach(l=>{
      const chg = l.prev ? (l.req-l.prev)/l.prev*100 : 0;
      rows += `<tr><td class="code">${l.code}</td><td>${T(l)}</td>
        ${showPrev?`<td class="num">${fmt(l.prev)}</td>`:`<td class="num">${fmt(l.req)}</td>`}
        <td class="num"><input class="amt" type="number" step="10000" min="0" id="${bindKey}-${l.code}" aria-label="${T(l)}" data-bind="${bindKey}:${l.code}" value="${l[field]}" ${editable?'':'disabled'}></td>
        <td class="num">${showPrev?pill(chg>15?'warn':'neutral',(chg>=0?'+':'')+chg.toFixed(1)+'%'):((l.appr-l.req)===0?pill('neutral','0'):pill('warn',fmt(l.appr-l.req)))}</td></tr>`;
    });
    const tot = S.lines.filter(l=>l.ch===ch).reduce((a,l)=>a+l[field],0), gap = tot - S.ceil[ch];
    rows += `<tr class="sub"><td></td><td>${L('Chapter','الباب')} ${ch} · ${T(CH[ch])} · ${L('ceiling','السقف')} ${fmt(S.ceil[ch])}</td><td></td>
      <td class="num">${fmt(tot)}</td><td class="num">${gap>0?pill('bad',L('Over by ','تجاوز بمقدار ')+fmt(gap)):pill('ok',L('Within · ','ضمن السقف · ')+fmt(-gap)+L(' left',' متبقٍ'))}</td></tr>`;
  });
  return rows;
}
function overCeiling(field){ const t=chTotals(field); return [2,3].filter(ch=>t[ch]>S.ceil[ch]); }

/* 4. PR */
function fundsFor(code, extra){
  const lg = ledger().find(x=>x.code===code);
  const used = lg.res+lg.com+lg.act;
  return {appr:lg.ap, used, avail:lg.avail, req:extra, after:lg.avail-extra};
}

/* 9. Monitor */
function cashSeries(){
  const totAppr = S.lines.reduce((a,l)=>a+l.appr,0);
  const base = Math.round(totAppr/12/1000)*1000;
  const fc = Array(12).fill(base);
  if(S.po) fc[3] += S.po.amount;
  const ac = [...ACTUAL_SEED, S.pay.released ? invTotal() : 0, null,null,null,null,null,null,null,null];
  return {fc, ac};
}
function cashChart(){
  const {fc, ac} = cashSeries(), W=720, H=250, padL=48, padB=28, padT=16, cw=(W-padL-10)/12;
  const max = Math.ceil(Math.max(...fc, ...ac.filter(x=>x!=null))/500000)*500000;
  const y = v => padT + (H-padT-padB)*(1 - v/max);
  let g='';
  for(let v=0; v<=max; v+=500000){ g+=`<line class="grid" x1="${padL}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${padL-6}" y="${y(v)+4}" text-anchor="end">${v===0?'0':fmtM(v)}</text>`; }
  fc.forEach((v,m)=>{
    const x = padL + m*cw + cw*0.15, bw = cw*0.34;
    g+=`<rect class="fc" x="${x}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="2"><title>${T(MONTHS)[m]} ${L('forecast','متوقع')}: ${fmt(v)}</title></rect>`;
    if(ac[m]!=null){ g+=`<rect class="ac" x="${x+bw+2}" y="${y(ac[m])}" width="${bw}" height="${Math.max(0,y(0)-y(ac[m]))}" rx="2"><title>${T(MONTHS)[m]} ${L('actual','فعلي')}: ${fmt(ac[m])}</title></rect>`; }
    g+=`<text class="axis" x="${padL+m*cw+cw/2}" y="${H-8}" text-anchor="middle">${T(MONTHS)[m]}</text>`;
  });
  const tx = padL + 3*cw + cw*0.5;
  g+=`<line class="today" x1="${tx}" x2="${tx}" y1="${padT-6}" y2="${y(0)}"/><text class="lbl" x="${tx+4}" y="${padT}">${L('8 Apr','8 أبريل')}</text>`;
  if(S.po){ g+=`<text class="lbl" x="${padL+3*cw+cw*0.15}" y="${y(fc[3])-5}">${L('+PO','+أمر الشراء')}</text>`; }
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('Monthly cash outflow, forecast versus actual, 2027','التدفق النقدي الشهري المتوقع مقابل الفعلي 2027')}">${g}</svg></div>`;
}

/* ---------- spec view ---------- */
function specText(){
  let t = `UNIFIED GRP · END-TO-END SCENARIO · IMPLEMENTER SPECIFICATION\n\n`;
  STEPS.forEach((s,i)=>{
    const m=MAP[s.id], so=S.signoff[s.id]||{};
    t += `${i+1}. ${s.en}  [${ROLES[s.role].en}]\n   Key-user status: ${so.status==='agree'?'AGREED':so.status==='change'?'CHANGE REQUESTED':'not reviewed'}${so.comment?`\n   Comment: ${so.comment}`:''}\n   UGRP process: ${m.ugrp}\n   GRP capability: ${m.erp[0]}\n   Acceptance criteria:\n${m.ac.map(a=>'   - '+a[0]).join('\n')}\n\n`;
  });
  return t;
}
function specView(){
  const agreed = STEPS.filter(s=>S.signoff[s.id]?.status==='agree').length;
  const cards = STEPS.map((s,i)=>{
    const m=MAP[s.id], so=S.signoff[s.id]||{};
    return `<article class="card spec-step"><div class="card-head"><div><div class="eyebrow">${L('Step','الخطوة')} ${i+1} · ${T(ROLES[s.role])}</div><h3>${T(s)}</h3></div>
      ${so.status==='agree'?pill('ok',L('Agreed','موافق عليها')):so.status==='change'?pill('warn',L('Change requested','طُلب تعديل')):pill('neutral',L('Not reviewed','لم تُراجع'))}</div>
      ${so.comment?`<p class="lead" style="font-size:13.5px"><b>${L('Comment','ملاحظة')}:</b> ${esc(so.comment)}</p>`:''}
      <dl class="map"><div><dt>${L('UGRP process','عملية النظام الموحد')}</dt><dd>${m.ugrp}</dd></div><div><dt>${L('GRP capability (any ERP platform)','قدرة النظام الموحد (أي منصة ERP)')}</dt><dd>${L(m.erp[0],m.erp[1])}</dd></div></dl>
      <ul class="ac">${m.ac.map(a=>`<li>${L(a[0],a[1])}</li>`).join('')}</ul>
      <div><button class="btn small" data-act="go" data-arg="${i}">${L('Open this screen','فتح الشاشة')}</button></div></article>`;}).join('');
  return `<div class="page">
    <div class="card-head"><div><div class="eyebrow">${L('Implementer specification','مواصفات المنفذ')}</div><h2>${L('The scenario is the requirement','السيناريو هو المتطلب')}</h2>
      <p class="lead">${L(`${agreed} of ${STEPS.length} steps agreed by key users. Each card is a test the configured ERP must pass, whichever ERP platform is chosen.`,`${agreed} من ${STEPS.length} خطوات وافق عليها المستخدمون الرئيسيون. كل بطاقة اختبار يجب أن يجتازه النظام بعد إعداده، أياً كانت منصة ERP المختارة.`)}</p></div>
      <button class="btn" data-act="copy" data-arg="spec">${S.copied==='spec'?L('Copied','تم النسخ'):L('Copy spec as text','نسخ المواصفات كنص')}</button></div>
    <div class="spec-grid">${cards}</div></div>`;
}

        <li>${L('Every screen states the UGRP process it covers and what the GRP must deliver, whichever ERP is chosen.','كل شاشة توضح عملية النظام الموحد التي تغطيها وما يجب أن يقدمه النظام الموحد أياً كانت منصة ERP.')}</li></ul></div>
    </div>
    ${banner('ok',L('<b>Already proven:</b> the ministry’s budget preparation system was specified this way. IT and the service provider worked from the app, not from a document.','<b>تجربة مثبتة:</b> حُددت متطلبات نظام إعداد موازنة الوزارة بهذه الطريقة، وعملت تقنية المعلومات ومزوّد الخدمة على التطبيق لا على وثيقة.'))}
    <ol class="method">
      <li><h3>${L('Model the scenario','بناء السيناريو')}</h3><p>${L('Build the end-to-end flow with key users, using their documents, terms and approval chains.','بناء المسار الكامل مع المستخدمين الرئيسيين بمستنداتهم ومصطلحاتهم ومسارات اعتمادهم.')}</p></li>
      <li><h3>${L('Click through and sign off','التجربة والموافقة')}</h3><p>${L('Key users walk the scenario and agree or request changes step by step, in days, not months.','يجرّب المستخدمون السيناريو ويوافقون أو يطلبون التعديل خطوة بخطوة، خلال أيام لا أشهر.')}</p></li>
      <li><h3>${L('Hand over as acceptance criteria','التسليم كمعايير قبول')}</h3><p>${L('The signed scenario becomes the spec the implementer configures the chosen ERP against.','يصبح السيناريو الموقّع المواصفات التي يُعد المنفذ عليها منصة ERP المختارة.')}</p></li>
      <li><h3>${L('Accept only what passes','القبول بما يجتاز فقط')}</h3><p>${L('UAT replays the same scenario. The ERP is accepted when it does what users already agreed to.','يُعاد السيناريو نفسه في اختبار القبول، ويُقبل النظام عندما يؤدي ما اتفق عليه المستخدمون مسبقاً.')}</p></li>
    </ol>
    <div class="actions"><button class="btn primary" data-act="start">${L('Walk through the scenario','استعراض السيناريو')}</button><button class="btn" data-act="view" data-arg="about">${L('About Ahmed','عن أحمد')}</button></div>
  </div>`;
}

/* ---------- actions ---------- */
function act(a, arg){
  switch(a){
    case 'view': S.view=arg; break;
    case 'start': S.view='scenario'; S.step=0; break;
    case 'go': { const i=+arg; if(i<0||i>=STEPS.length) return; S.step=i; S.view='scenario'; window.scrollTo({top:0}); break; }
    case 'lang': S.lang = S.lang==='en'?'ar':'en'; break;
    case 'reset': { const lang=S.lang; S=init(lang); S.view='scenario'; break; }
    case 'issue':
      S.circular=true; audit('mof',`Circular issued: ceilings Ch.2 ${fmt(S.ceil[2])}, Ch.3 ${fmt(S.ceil[3])}`,`صدر التعميم: سقف الباب 2 ${fmt(S.ceil[2])}، الباب 3 ${fmt(S.ceil[3])}`,DATES.circular); break;
    case 'submit':
      if(overCeiling('req').length) return;
      S.submitted=true; S.lines.forEach(l=>l.appr=l.req);
      audit('entfin',`Proposal submitted: ${fmt(chTotals('req')[2]+chTotals('req')[3])} QR`,`أُرسل المقترح: ${fmt(chTotals('req')[2]+chTotals('req')[3])} ر.ق`,DATES.proposal); break;
    case 'approve':
      if(overCeiling('appr').length) return;
      S.approved=true; const t=S.lines.reduce((x,l)=>x+l.appr,0);
      audit('mof',`Budget approved and loaded to control: ${fmt(t)} QR`,`اعتُمدت الموازنة وحُمّلت للرقابة: ${fmt(t)} ر.ق`,DATES.approve); break;
    case 'check': S.pr.checked=true; break;
    case 'sim600': S.pr.items[0].qty=600; S.pr.checked=true; break;
    case 'reserve': {
      const f=fundsFor(PR_LINE,prTotal()); S.pr.checked=true; if(f.after<0) break;
      S.pr.snap=f; S.pr.status='reserved'; audit('req',`PR-2027-0412 approved; ${fmt(prTotal())} QR reserved on ${bd(PR_LINE)}`,`اعتُمد طلب الشراء PR-2027-0412؛ حُجز ${fmt(prTotal())} ر.ق على البند ${bd(PR_LINE)}`,DATES.pr); break; }
    case 'issuePO': {
      const q=quote(S.selQuote); if(!q.ok) return;
      const prices={}; S.pr.items.forEach(i=>prices[i.id]=q.p[i.id]);
      S.po={no:'PO-2027-000231', q:q.id, prices, amount:quoteTotal(q), reserved:prTotal()};
      S.pr.items.forEach(i=>{S.grn.qty[i.id]=i.qty; S.inv.qty[i.id]=i.qty;});
      audit('proc',`${S.po.no} issued to ${q.en}: ${fmt(S.po.amount)} QR; reservation converted to commitment`,`صدر ${S.po.no} إلى ${q.ar}: ${fmt(S.po.amount)} ر.ق؛ تحوّل الحجز إلى ارتباط`,DATES.po); break; }
    case 'grn': {
      S.grn.done=true; const d=S.pr.items.map(i=>`${S.grn.qty[i.id]}/${i.qty}`).join(', ');
      audit('wh',`GRN-2027-0193 recorded against ${S.po.no} (${d})`,`سُجّل محضر الاستلام GRN-2027-0193 مقابل ${S.po.no} (${d})`,DATES.grn); break; }
    case 'match': {
      const mm=invMismatch();
      if(mm.length){
        S.inv.status='hold';
        S.inv.holdMsg = mm.map(i=>L(`${i.en}: billed ${S.inv.qty[i.id]}, received ${S.grn.qty[i.id]}.`,`${i.ar}: المفوتر ${S.inv.qty[i.id]}، المستلم ${S.grn.qty[i.id]}.`)).join(' ') + ' ' + L('Ask the supplier for a corrected invoice, or record the remaining receipt.','اطلب من المورد فاتورة معدّلة، أو سجّل استلام الكمية المتبقية.');
        audit('ap','INV-AW-2027-0147 placed on quantity hold','أُوقفت الفاتورة INV-AW-2027-0147 لعدم مطابقة الكمية',DATES.inv);
      } else {
        S.inv.status='approved';
        audit('ap',`INV-AW-2027-0147 matched and approved: ${fmt(invTotal())} QR moved to actual`,`طوبقت الفاتورة INV-AW-2027-0147 واعتُمدت: انتقل ${fmt(invTotal())} ر.ق إلى الفعلي`,DATES.inv);
      } break; }
    case 'sign': { const k=+arg; if(k>0&&!S.pay.sign[k-1]) return; S.pay.sign[k]=true; const s=band(invTotal()).signers[k];
      audit('tr',`PAY-2027-0311 signed by ${s.en}`,`وُقّعت الدفعة PAY-2027-0311 من ${s.ar}`,DATES.pay); break; }
    case 'file': S.pay.file=true; audit('tr','Bank file generated for PAY-2027-0311','أُنشئ ملف البنك للدفعة PAY-2027-0311',DATES.pay); break;
    case 'release': S.pay.released=true; audit('tr',`Payment of ${fmt(invTotal())} QR released to bank`,`أُفرج عن دفعة بمبلغ ${fmt(invTotal())} ر.ق إلى البنك`,DATES.pay); break;
    case 'agree': case 'change': {
      const id=STEPS[S.step].id; S.signoff[id]={...(S.signoff[id]||{}), status:a};
      audit(STEPS[S.step].role, `Key user ${a==='agree'?'agreed to':'requested a change on'} step ${S.step+1}: ${STEPS[S.step].en}`, `المستخدم الرئيسي ${a==='agree'?'وافق على':'طلب تعديل'} الخطوة ${S.step+1}: ${STEPS[S.step].ar}`, DATES[id]); break; }
    case 'copy': {
      const text = arg==='file' ? bankFile() : specText();
      const done = () => { S.copied=arg; render(); setTimeout(()=>{S.copied=null; render();},1600); };
      try { navigator.clipboard.writeText(text).then(done, ()=>fallbackCopy(text, done)); } catch(e){ fallbackCopy(text, done); }
      return; }
  }
  render();
}
function fallbackCopy(text, done){
  const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); done();
}
function bind(key, val){
  const [k, id] = key.split(':'); const n = Math.max(0, Math.round(Number(val)||0));
  if(k==='ceil') S.ceil[id]=n;
  else if(k==='req') line(id).req=n;
  else if(k==='appr') line(id).appr=n;
  else if(k==='prqty'){ S.pr.items.find(i=>i.id===id).qty=n; }
  else if(k==='quote') S.selQuote=val;
  else if(k==='grn'){ const it=S.pr.items.find(i=>i.id===id); S.grn.qty[id]=Math.min(n,it.qty); }
  else if(k==='inv'){ S.inv.qty[id]=n; S.inv.status=null; }
}
document.addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; act(b.dataset.act, b.dataset.arg); });
document.addEventListener('change', e=>{ const i=e.target; if(i.dataset && i.dataset.bind){ bind(i.dataset.bind, i.value); const id=i.id; render(); const again=id&&document.getElementById(id); if(again&&again.type!=='radio') again.focus(); } });
document.addEventListener('input', e=>{ const i=e.target; if(i.dataset && i.dataset.live){ const id=i.dataset.live.split(':')[1]; S.signoff[id]={...(S.signoff[id]||{}), comment:i.value}; } });
document.addEventListener('keydown', e=>{ const i=e.target; if(e.key==='Enter' && i.dataset && i.dataset.bind){ i.blur(); } });
render();
</script>
